name: Build V10 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GoTr_AI_9_7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoTr-Ail-V10-debug-apk
          path: GoTr_AI_9_7/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
